[package]
name = "unrar"
version = "0.5.8"
authors = [
  "Danyel Bayraktar <rust@danyel.io>",
  "vjoki <vjoki@zv.fi>",
]
edition = "2021"

license = "MIT OR Apache-2.0"
description = "list and extract RAR archives"
repository = "https://github.com/muja/unrar.rs"
exclude = ["/tests/native_errors.rs", "/tests/native_primary_stream.rs"]

[dependencies]
regex = "1"
bitflags = "2"
widestring = "1"

[dependencies.unrar_sys]
path = "unrar_sys"
version = "0.5"

[dev-dependencies]
unrar-native-tests = { path = "tests/native" }
tempfile = "3.12.0"
